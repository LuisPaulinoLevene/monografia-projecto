<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloads</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .container {
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(10px);
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        max-width: 600px;
        width: 90%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
        margin-bottom: 10px;
    }

    p.subtitle {
        color: #cbd5e1;
        margin-bottom: 30px;
    }

    .downloads {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .btn {
        display: block;
        text-decoration: none;
        background: #2563eb;
        color: white;
        padding: 16px;
        border-radius: 12px;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
    }

    .status {
        color: #cbd5e1;
        margin-top: 20px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Downloads</h1>
    <p class="subtitle">Baixe o Projeto de Monografia (PDF) e o Draft do Plano Automático (ZIP)</p>

    <div id="downloads" class="downloads">
        <div class="status">Procurando arquivos...</div>
    </div>
</div>

<script>
function listarArquivos() {
    const downloadsDiv = document.getElementById("downloads");

    // Nomes reais dos arquivos na pasta
    const pdfArquivo = "Projecto de monografia Luis.pdf";
    const zipArquivo = "Aplicacao web Plano Automatico-Projecto inicial.zip";

    // Cria os botões de download
    let html = `
        <a class="btn" href="${encodeURIComponent(pdfArquivo)}" download>
            📄 Baixar Projeto de Monografia
        </a>
        <a class="btn" href="${encodeURIComponent(zipArquivo)}" download>
            📦 Baixar Draft do Plano Automático
        </a>
    `;

    downloadsDiv.innerHTML = html;
}

// Executa ao carregar a página
listarArquivos();
</script>

</body>
</html>
